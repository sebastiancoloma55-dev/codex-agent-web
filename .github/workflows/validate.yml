name: Validate NEXUS AI
on:
  push:
    branches:
      - feat/nexus-futuristic-open-chat
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check serverless API syntax
        run: |
          for file in api/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Extract and check inline browser scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline browser scripts found")
          for i, script in enumerate(inline, 1):
              Path(f"/tmp/nexus-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Checking {len(inline)} inline script(s)")
          PY
          for file in /tmp/nexus-inline-*.js; do
            node --check "$file"
          done

  preview-smoke:
    if: github.event_name == 'push'
    needs: syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel Preview and verify API health
        shell: bash
        run: |
          url="https://nexus-ai-git-feat-nexus-futuristic-open-chat-simi23.vercel.app"
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/status.json -w "%{http_code}" "$url/api/status" || true)
            if [ "$code" = "200" ] && EXPECTED_SHA="$GITHUB_SHA" python -c 'import json,os; d=json.load(open("/tmp/status.json")); raise SystemExit(0 if d.get("commit")==os.environ["EXPECTED_SHA"] else 1)'; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then echo "The exact Preview commit did not become ready in 3 minutes"; exit 1; fi
          EXPECTED_SHA="$GITHUB_SHA" python - <<'PY'
          import json,os
          data=json.load(open("/tmp/status.json"))
          assert data.get("commit")==os.environ["EXPECTED_SHA"], "Preview commit does not match the pushed Git commit"
          assert data["providers"].get("openrouter") is True, "OpenRouter key is not available in Preview"
          assert data["providers"].get("openai") is False, "Paid OpenAI provider should stay disabled"
          assert data["providers"].get("anthropic") is False, "Paid Anthropic provider should stay disabled"
          assert data["providers"].get("gemini") is False, "Gemini provider should stay disabled unless explicitly enabled"
          print("Provider status OK:", data["providers"])
          PY
      - name: Verify page, permissions and chat validation
        shell: bash
        run: |
          url="https://nexus-ai-git-feat-nexus-futuristic-open-chat-simi23.vercel.app"
          curl -fsS "$url/" -o /tmp/index.html
          grep -q "NEXUS AI" /tmp/index.html
          curl -fsS "$url/api/permissions" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["mode"]=="open-chat"; assert next(x for x in d["capabilities"] if x["id"]=="chat")["allowed"] is True; print("Permissions endpoint OK")'
          code=$(curl -sS -o /tmp/chat.json -w "%{http_code}" -X POST "$url/api/chat" -H "Content-Type: application/json" -d '{"message":"","provider":"openrouter","model":"openrouter/free"}')
          test "$code" = "400"
          echo "Chat validation endpoint OK (no model quota consumed)"

      - name: Test real OpenRouter Free chat and image understanding
        shell: bash
        run: |
          url="https://nexus-ai-git-feat-nexus-futuristic-open-chat-simi23.vercel.app"
          python - <<'PY'
          import json
          payload={"message":"Responde exactamente NEXUS_OK y nada más.","provider":"openrouter","model":"openrouter/free","stream":True}
          json.dump(payload,open("/tmp/text-request.json","w"))
          image="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAK0lEQVR4nO3NQQEAAATAQATRP5QwSvC7BdjldMdn9XoHAAAAAAAAAAAAhy3SgAFYpLG4gwAAAABJRU5ErkJggg=="
          payload={"message":"¿Qué color predomina en esta imagen? Responde en una sola palabra.","provider":"openrouter","model":"openrouter/free","images":[{"name":"red-test.png","data":image}],"stream":True}
          json.dump(payload,open("/tmp/image-request.json","w"))
          PY
          code=$(curl -sS -N -o /tmp/text-response.txt -w "%{http_code}" -X POST "$url/api/chat" -H "Content-Type: application/json" --data-binary @/tmp/text-request.json)
          test "$code" = "200"
          python - <<'PY'
          import json
          raw=open("/tmp/text-response.txt").read()
          parts=[]
          for line in raw.splitlines():
              if line.startswith("data:"):
                  value=line[5:].strip()
                  if value=="[DONE]" or not value: continue
                  item=json.loads(value)
                  if item.get("error"): raise SystemExit(item["error"])
                  parts.append(item.get("choices",[{}])[0].get("delta",{}).get("content",""))
          answer="".join(parts).strip()
          assert "NEXUS_OK" in answer, f"Unexpected text response: {answer!r}"
          print("Real text chat OK")
          PY
          code=$(curl -sS -N -o /tmp/image-response.txt -w "%{http_code}" -X POST "$url/api/chat" -H "Content-Type: application/json" --data-binary @/tmp/image-request.json)
          test "$code" = "200"
          python - <<'PY'
          import json
          raw=open("/tmp/image-response.txt").read()
          parts=[]
          for line in raw.splitlines():
              if line.startswith("data:"):
                  value=line[5:].strip()
                  if value=="[DONE]" or not value: continue
                  item=json.loads(value)
                  if item.get("error"): raise SystemExit(item["error"])
                  parts.append(item.get("choices",[{}])[0].get("delta",{}).get("content",""))
          answer="".join(parts).strip().lower()
          assert answer, "Image request returned no text"
          assert "roj" in answer or "red" in answer, f"Image understanding mismatch: {answer!r}"
          print("Real image understanding OK:", answer)
          PY
      - name: Run mobile browser end-to-end test
        shell: bash
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          node tests/preview-e2e.mjs

