name: Validate NEXUS AI
on:
  push:
    branches:
      - feat/nexus-futuristic-open-chat
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check serverless API syntax
        run: |
          for file in api/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Extract and check inline browser scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline browser scripts found")
          for i, script in enumerate(inline, 1):
              Path(f"/tmp/nexus-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Checking {len(inline)} inline script(s)")
          PY
          for file in /tmp/nexus-inline-*.js; do
            node --check "$file"
          done

  preview-smoke:
    if: github.event_name == 'push'
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel Preview and verify API health
        shell: bash
        run: |
          url="https://nexus-ai-git-feat-nexus-futuristic-open-chat-simi23.vercel.app"
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/status.json -w "%{http_code}" "$url/api/status" || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then echo "Preview did not become ready in 3 minutes"; exit 1; fi
          python - <<'PY'
          import json
          data=json.load(open("/tmp/status.json"))
          assert data["providers"].get("openrouter") is True, "OpenRouter key is not available in Preview"
          assert data["providers"].get("openai") is False, "Paid OpenAI provider should stay disabled"
          assert data["providers"].get("anthropic") is False, "Paid Anthropic provider should stay disabled"
          assert data["providers"].get("gemini") is False, "Gemini provider should stay disabled unless explicitly enabled"
          print("Provider status OK:", data["providers"])
          PY
      - name: Verify page, permissions and chat validation
        shell: bash
        run: |
          url="https://nexus-ai-git-feat-nexus-futuristic-open-chat-simi23.vercel.app"
          curl -fsS "$url/" -o /tmp/index.html
          grep -q "NEXUS AI" /tmp/index.html
          curl -fsS "$url/api/permissions" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["mode"]=="open-chat"; assert next(x for x in d["capabilities"] if x["id"]=="chat")["allowed"] is True; print("Permissions endpoint OK")'
          code=$(curl -sS -o /tmp/chat.json -w "%{http_code}" -X POST "$url/api/chat" -H "Content-Type: application/json" -d '{"message":"","provider":"openrouter","model":"openrouter/free"}')
          test "$code" = "400"
          echo "Chat validation endpoint OK (no model quota consumed)"
